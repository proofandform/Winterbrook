name: Import approved Emmet Gardens photographs
on:
  push:
    branches: [content/emmet-gardens-approved-publication]
    paths: [.github/workflows/import-emmet-gardens-photos.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: content/emmet-gardens-approved-publication
      - name: Download and verify the three client-approved originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --location --retry 3 --max-time 60 --proto '=https' --proto-redir '=https' 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JJsmOdPK7s3Mx3RqcYszp49QFA/1a04b723-5c1e-4f3b-a427-91513d899fbb.jpg' -o public/images/emmet-gardens-sod-turning-ceremony.jpg
          curl --fail --location --retry 3 --max-time 60 --proto '=https' --proto-redir '=https' 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JJsmOdPK7s3Mx3RqcYszp49QFA/656967bd-a01a-46cc-a748-00cd5ab3b915.jpg' -o public/images/emmet-gardens-winterbrook-team.jpg
          curl --fail --location --retry 3 --max-time 60 --proto '=https' --proto-redir '=https' 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JJsmOdPK7s3Mx3RqcYszp49QFA/f0f67b65-7c13-42ff-a9e1-dc2da60ef7be.jpg' -o public/images/emmet-gardens-sod-turning-celebration.jpg
          printf '%s\n' \
            '73a6339d1aa64fa0a8e83147a66ad33917b6c15a63cb0a3a809c390e15ea63e7  public/images/emmet-gardens-sod-turning-ceremony.jpg' \
            'f9e8eded08ac2bdea491db32571e27ca71465ffbb034d111cfad40b1be3a9da2  public/images/emmet-gardens-winterbrook-team.jpg' \
            'c1ba9949e05ab96077479a38efea35e901892c1952c52f019cb89bbc799ce307  public/images/emmet-gardens-sod-turning-celebration.jpg' | sha256sum --check --strict
      - name: Commit only the verified photographs to the publication branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/images/emmet-gardens-sod-turning-ceremony.jpg public/images/emmet-gardens-winterbrook-team.jpg public/images/emmet-gardens-sod-turning-celebration.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add three approved Emmet Gardens event photographs'
            git push origin HEAD:content/emmet-gardens-approved-publication
          fi
